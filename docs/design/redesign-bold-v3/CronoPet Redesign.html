<title>CronoPet — Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />

<style>
  * { -webkit-font-smoothing: antialiased; }
  html, body { margin: 0; padding: 0; }
  body { font-family: -apple-system, "SF Pro Text", system-ui, sans-serif; background: #E8E3D2; }
  #root { width: 100%; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  @keyframes sheetUp { from { transform: translateY(40px); } to { transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes toastIn { from { transform: translateY(-14px) scale(0.94); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }
  /* image-slot empty state — warm placeholder */
  image-slot { background:
    repeating-linear-gradient(135deg, #EFEAD6 0 14px, #E7E0C8 14px 28px) !important; }
</style>
